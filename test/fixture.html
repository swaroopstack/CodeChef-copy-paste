<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CodeChef clipboard lockdown fixture</title>
  <style>
    html, body { margin: 0; background: #0b1020; color: #d1d5db; font: 14px system-ui, sans-serif; }
    h1 { font-size: 15px; padding: 12px 16px; margin: 0; background: #111827; }
    #editor { width: min(900px, calc(100vw - 32px)); height: 380px; margin: 16px; border: 1px solid #334155; }
    #outside { display: block; width: min(900px, calc(100vw - 32px)); height: 60px; margin: 16px; }
    p { margin: 16px; color: #94a3b8; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.36.5/src-min-noconflict/ace.js"></script>
</head>
<body>
  <h1>CodeChef clipboard lockdown fixture</h1>
  <div id="editor"></div>
  <p>This page reproduces CodeChef's clipboard lockdown around a real Ace editor.</p>
  <textarea id="outside" aria-label="Outside editor">outside text</textarea>

  <script>
    // ---------------------------------------------------------------------
    // Reproduce the relevant part of CodeChef's LabEditor lockdown *before*
    // mounting Ace, which is the worst case for an extension.
    // ---------------------------------------------------------------------
    const blockedEvents = [
      'copy', 'cut', 'paste', 'beforecopy', 'beforecut', 'beforepaste',
      'contextmenu', 'selectstart', 'select', 'dragstart', 'drag', 'dragenter',
      'dragover', 'dragleave', 'drop', 'dragend'
    ];

    const swallow = (event) => {
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      return false;
    };

    const originalAddEventListener = EventTarget.prototype.addEventListener;
    EventTarget.prototype.addEventListener = function (type, listener, options) {
      if (blockedEvents.includes(String(type).toLowerCase())) return;
      return originalAddEventListener.call(this, type, listener, options);
    };
    window.__lockdownAdd = EventTarget.prototype.addEventListener;

    try {
      Object.defineProperty(navigator, 'clipboard', {
        configurable: false,
        value: {
          readText: () => Promise.reject(new Error('Clipboard access denied')),
          writeText: () => Promise.reject(new Error('Clipboard access denied')),
          read: () => Promise.reject(new Error('Clipboard access denied')),
          write: () => Promise.reject(new Error('Clipboard access denied'))
        }
      });
    } catch (_) {
      /* ignore */
    }

    const originalExecCommand = document.execCommand.bind(document);
    document.execCommand = function (command) {
      if (['copy', 'cut', 'paste', 'selectall'].includes(String(command).toLowerCase())) return false;
      return originalExecCommand.apply(document, arguments);
    };
    window.__lockdownExec = document.execCommand;
    window.__lockdownApplied = true;

    const shortcutBlocker = (event) => {
      const key = String(event.key || '').toLowerCase();
      const modifier = event.ctrlKey || event.metaKey;
      const blocked =
        (modifier && ['c', 'x', 'v', 'a', 's', 'p'].includes(key)) ||
        key === 'f12' ||
        (modifier && event.shiftKey && ['i', 'j', 'c'].includes(key)) ||
        (modifier && key === 'u') ||
        key === 'printscreen';
      return blocked ? swallow(event) : true;
    };

    document.addEventListener('keydown', shortcutBlocker, true);
    document.addEventListener('keyup', shortcutBlocker, true);
    document.addEventListener('keypress', shortcutBlocker, true);
    // CodeChef also tries this, but its own addEventListener patch drops it.
    document.addEventListener('contextmenu', swallow, true);

    // Mount Ace only after the lockdown, so Ace cannot register its own
    // copy/cut/paste listeners (exactly what happens in the real editor).
    window.editor = ace.edit('editor');
    window.editor.setTheme('ace/theme/monokai');
    window.editor.session.setMode('ace/mode/javascript');
    window.editor.setValue('AAA\nBBB\nCCC', -1);
    window.editor.setOptions({ fontFamily: 'monospace', fontSize: 16 });
    window.editor.focus();

    // Simulate the editor container's own context-menu suppressor, which is
    // registered with the original addEventListener before the lockdown.
    const aceContent = document.querySelector('.ace_content');
    if (aceContent) originalAddEventListener.call(aceContent, 'contextmenu', swallow, true);

    window.selectCode = (startRow, startColumn, endRow, endColumn) => {
      window.editor.focus();
      window.editor.selection.setRange(new ace.Range(startRow, startColumn, endRow, endColumn));
    };

    window.scrollToEnd = () => {
      window.editor.navigateFileEnd();
      window.editor.clearSelection();
      window.editor.focus();
    };

    window.updateOutside = () => {
      const outside = document.querySelector('#outside');
      outside.value = 'outside-secret';
      outside.focus();
      outside.select();
    };
  </script>
</body>
</html>
